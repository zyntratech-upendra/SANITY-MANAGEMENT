<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="radarSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Radar Grid Background -->
  <circle cx="80" cy="80" r="70" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Concentric Rings -->
  <circle cx="80" cy="80" r="54" fill="none" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6"/>
  <circle cx="80" cy="80" r="36" fill="none" stroke="#0284c7" stroke-width="1.2" opacity="0.7"/>
  <circle cx="80" cy="80" r="18" fill="none" stroke="#0284c7" stroke-width="1.2" opacity="0.8"/>

  <!-- Crosshairs -->
  <line x1="10" y1="80" x2="150" y2="80" stroke="#0369a1" stroke-width="1" opacity="0.5"/>
  <line x1="80" y1="10" x2="80" y2="150" stroke="#0369a1" stroke-width="1" opacity="0.5"/>

  <!-- Rotating Sweep Radar Beam -->
  <g transform="translate(80, 80)">
    <path d="M0 0 L54 -36 A64 64 0 0 1 64 0 Z" fill="url(#radarSweep)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <line x1="0" y1="0" x2="64" y2="0" stroke="#38bdf8" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.4s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Pulsing Blips (IoT Sensors Online) -->
  <circle cx="105" cy="55" r="4" fill="#10b981">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;5.5;3" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="55" cy="100" r="3.5" fill="#10b981">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="115" cy="105" r="3" fill="#f59e0b">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Center Hub -->
  <circle cx="80" cy="80" r="5" fill="#38bdf8"/>
  <circle cx="80" cy="80" r="9" fill="none" stroke="#38bdf8" stroke-width="1.5">
    <animate attributeName="r" values="5;14;5" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Telemetry Active Pill -->
  <g transform="translate(38, 134)">
    <rect x="0" y="0" width="84" height="20" rx="10" fill="#0284c7"/>
    <text x="42" y="14" text-anchor="middle" fill="#ffffff" font-size="8.5" font-weight="900" font-family="system-ui">IoT ONLINE</text>
  </g>
</svg>

